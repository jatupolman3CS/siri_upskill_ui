<div class="relative aspect-video w-full overflow-hidden rounded-[var(--radius-lg)] glass-card">
  @switch (state()) {
    @case ('playing') {
      <video
        #video
        controls
        autoplay
        playsinline
        preload="metadata"
        [attr.aria-label]="'tutoring.public.profile.video.playerLabel' | translate: { name: displayName() }"
        class="h-full w-full bg-black"
      ></video>
    }
    @case ('loading') {
      <div class="absolute inset-0" aria-busy="true" role="status" [attr.aria-label]="'tutoring.public.profile.video.loading' | translate">
        <app-skeleton variant="block" width="100%" height="100%" />
      </div>
    }
    @case ('error') {
      <div class="absolute inset-0 flex flex-col items-center justify-center gap-3 p-4 text-center">
        <p role="alert" class="text-sm text-[var(--color-text)]">{{ errorKey() | translate }}</p>
        <app-button size="sm" variant="secondary" (click)="play()">{{ 'tutoring.public.profile.video.retry' | translate }}</app-button>
      </div>
    }
    @default {
      <button
        type="button"
        (click)="play()"
        [attr.aria-label]="'tutoring.public.profile.video.playLabel' | translate: { name: displayName() }"
        class="group absolute inset-0 flex flex-col items-center justify-center gap-3 text-[var(--color-text)]
          transition-colors hover:bg-[var(--color-surface-muted)] focus-visible:outline-none focus-visible:ring-2
          focus-visible:ring-inset focus-visible:ring-[var(--color-focus-ring)]"
      >
        <span
          aria-hidden="true"
          class="flex h-16 w-16 items-center justify-center rounded-full bg-[var(--color-primary)] text-3xl text-[var(--color-primary-foreground)]
            shadow-[var(--shadow-md)] transition-transform duration-200 group-hover:scale-105 motion-reduce:transition-none motion-reduce:group-hover:scale-100"
        >
          <ng-icon name="phosphorPlay" />
        </span>
        <span class="text-base font-semibold">{{ 'tutoring.public.profile.video.play' | translate }}</span>
        <span class="text-sm text-[var(--color-text-muted)]">{{ durationSeconds() | duration: 'compact' }}</span>
      </button>
    }
  }
</div>
