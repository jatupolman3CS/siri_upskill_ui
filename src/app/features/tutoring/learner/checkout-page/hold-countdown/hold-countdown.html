@if (remainingMs() !== null) {
  <div
    role="timer"
    [class]="tone() + ' inline-flex min-h-11 items-center gap-2 rounded-full bg-[var(--tone-bg)] px-4 py-2 text-base font-semibold text-[var(--tone-fg)]'"
  >
    <ng-icon name="phosphorTimer" aria-hidden="true" class="text-xl" />
    <span>{{ 'tutoring.checkout.countdown.remaining' | translate: { time: time() } }}</span>
  </div>
  <p class="sr-only" role="status">{{ stageMessage() | translate }}</p>
}
