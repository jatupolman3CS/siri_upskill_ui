<section>
  <h2 class="mb-3 text-sm font-semibold text-[var(--color-text)]">{{ 'live.catalog.filter.heading' | translate }}</h2>
  <ul class="flex flex-col gap-1">
    @for (option of options(); track option.format) {
      <li>
        <button
          type="button"
          (click)="toggle(option.format)"
          [disabled]="option.disabled"
          [attr.aria-pressed]="selected() === option.format"
          class="flex min-h-11 w-full cursor-pointer items-center justify-between gap-2 rounded-[var(--radius-md)] px-3 text-left text-sm transition-colors
            disabled:cursor-not-allowed disabled:opacity-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-focus-ring)]"
          [class]="
            selected() === option.format
              ? 'bg-[var(--color-surface-muted)] font-semibold text-[var(--color-primary)]'
              : 'text-[var(--color-text)] hover:bg-[var(--color-surface-muted)]'
          "
        >
          <span>{{ 'live.catalog.format.' + option.format | translate }}</span>
          @if (option.count !== null) {
            <span class="text-xs text-[var(--color-text-muted)]">({{ option.count }})</span>
          }
        </button>
      </li>
    }
  </ul>
</section>
