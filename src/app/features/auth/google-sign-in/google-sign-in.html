@if (clientId()) {
  <div class="flex flex-col gap-3">
    <div
      #buttonHost
      class="flex min-h-11 w-full justify-center"
      [class.pointer-events-none]="submitting()"
      [class.opacity-60]="submitting()"
      [attr.aria-busy]="submitting()"
    ></div>

    @if (submitting()) {
      <p class="text-center text-sm text-[var(--color-text-muted)]" aria-live="polite">
        {{ 'auth.google.signingIn' | translate }}
      </p>
    }

    @if (errorMessage(); as message) {
      <p role="alert" class="text-center text-sm text-[var(--color-danger)]">{{ message }}</p>
    }

    @if (dividerKey(); as key) {
      <div class="mt-1 flex items-center gap-3">
        <div class="h-px flex-1 bg-[var(--color-border)]"></div>
        <span class="text-xs font-semibold text-[var(--color-text-muted)]">
          {{ key | translate }}
        </span>
        <div class="h-px flex-1 bg-[var(--color-border)]"></div>
      </div>
    }
  </div>
}
