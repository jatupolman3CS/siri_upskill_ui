<div
  class="flex flex-col items-center gap-2 rounded-[var(--radius-lg)] border-2 border-dashed px-4 py-5 text-center transition-colors duration-200 motion-reduce:transition-none"
  [class]="
    dragging()
      ? 'border-[var(--color-primary)] bg-[var(--color-surface-muted)]'
      : 'border-[var(--color-border)] bg-[var(--color-bg)]'
  "
  (dragenter)="onDragOver($event)"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  <ng-icon size="2rem" name="phosphorCloudArrowUp" aria-hidden="true" class="text-[var(--color-primary)]" />
  <p class="text-sm font-medium text-[var(--color-text)]">
    {{ (dragging() ? 'teachingMaterials.drop.dropping' : 'teachingMaterials.drop.title') | translate }}
  </p>
  <input
    #picker
    type="file"
    multiple
    class="sr-only"
    tabindex="-1"
    aria-hidden="true"
    [accept]="accept"
    (change)="onPick($event)"
  />
  <app-button size="sm" variant="secondary" [disabled]="disabled()" (click)="picker.click()">
    <ng-icon size="1.25rem" leading name="phosphorUploadSimple" aria-hidden="true" />
    {{ 'teachingMaterials.drop.choose' | translate }}
  </app-button>
  <p class="max-w-md text-sm text-[var(--color-text-muted)]">{{ 'teachingMaterials.drop.hint' | translate: hintParams }}</p>
</div>
