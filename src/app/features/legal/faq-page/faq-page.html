<div class="animate-fade-in mx-auto max-w-4xl px-4 py-12 space-y-8">
  <header class="animate-fade-in-down space-y-2 text-center max-w-2xl mx-auto">
    <h1 class="text-3xl font-black tracking-tight text-[var(--color-text)]">
      {{ 'faq.title' | translate }}
    </h1>
    <p class="text-xs sm:text-sm text-[var(--color-text-muted)]">
      {{ 'faq.subtitle' | translate }}
    </p>
  </header>

  <!-- Filter tabs -->
  <div class="animate-fade-in-up stagger-1 flex flex-wrap justify-center gap-2">
    <button
      type="button"
      (click)="setCategory('all')"
      [class.bg-[var(--color-primary)]]="activeCategory() === 'all'"
      [class.text-[var(--color-primary-foreground)]]="activeCategory() === 'all'"
      [class.border-[var(--color-border)]]="activeCategory() !== 'all'"
      class="btn-tactile px-4 py-1.5 text-xs font-semibold rounded-full border transition"
    >
      {{ 'faq.catAll' | translate }}
    </button>
    <button
      type="button"
      (click)="setCategory('learning')"
      [class.bg-[var(--color-primary)]]="activeCategory() === 'learning'"
      [class.text-[var(--color-primary-foreground)]]="activeCategory() === 'learning'"
      [class.border-[var(--color-border)]]="activeCategory() !== 'learning'"
      class="btn-tactile px-4 py-1.5 text-xs font-semibold rounded-full border transition"
    >
      {{ 'faq.catLearning' | translate }}
    </button>
    <button
      type="button"
      (click)="setCategory('payment')"
      [class.bg-[var(--color-primary)]]="activeCategory() === 'payment'"
      [class.text-[var(--color-primary-foreground)]]="activeCategory() === 'payment'"
      [class.border-[var(--color-border)]]="activeCategory() !== 'payment'"
      class="btn-tactile px-4 py-1.5 text-xs font-semibold rounded-full border transition"
    >
      {{ 'faq.catPayment' | translate }}
    </button>
    <button
      type="button"
      (click)="setCategory('technical')"
      [class.bg-[var(--color-primary)]]="activeCategory() === 'technical'"
      [class.text-[var(--color-primary-foreground)]]="activeCategory() === 'technical'"
      [class.border-[var(--color-border)]]="activeCategory() !== 'technical'"
      class="btn-tactile px-4 py-1.5 text-xs font-semibold rounded-full border transition"
    >
      {{ 'faq.catTechnical' | translate }}
    </button>
  </div>

  <!-- FAQ Accordion List -->
  <div class="animate-fade-in-up stagger-2 space-y-4 pt-4">
    @for (faq of filteredFaqs; track faq.question) {
      <details class="card-hover group rounded-2xl border border-[var(--color-border)] bg-[var(--color-surface)] p-5 open:shadow-sm transition">
        <summary class="flex cursor-pointer items-center justify-between font-bold text-xs sm:text-sm text-[var(--color-text)] list-none focus-visible:outline-none">
          <span>{{ faq.question }}</span>
          <span class="ml-4 shrink-0 text-[var(--color-text-muted)] group-open:rotate-180 transition-transform duration-200">
            ▼
          </span>
        </summary>
        <p class="mt-3 text-xs sm:text-sm text-[var(--color-text-muted)] leading-relaxed border-t border-[var(--color-border)] pt-3">
          {{ faq.answer }}
        </p>
      </details>
    }
  </div>

  <!-- Contact CTA -->
  <div class="animate-fade-in-up stagger-3 mt-12 rounded-2xl border border-[var(--color-border)] bg-[var(--color-surface-hover)] p-6 text-center space-y-3">
    <h2 class="text-sm font-bold text-[var(--color-text)]">{{ 'faq.ctaHeading' | translate }}</h2>
    <p class="text-xs text-[var(--color-text-muted)]">
      {{ 'faq.ctaDesc' | translate }}
    </p>
    <a
      routerLink="/contact"
      class="btn-tactile inline-block px-5 py-2 text-xs font-semibold rounded-xl bg-[var(--color-primary)] text-[var(--color-primary-foreground)] hover:bg-[var(--color-primary-hover)] transition"
    >
      {{ 'faq.ctaButton' | translate }}
    </a>
  </div>
</div>
