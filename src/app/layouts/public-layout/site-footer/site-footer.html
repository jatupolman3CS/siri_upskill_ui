<!-- Bottom padding on small screens clears the fixed bottom mobile nav (h-14 + safe area). -->
<footer class="glass-pill rounded-none border-x-0 border-b-0 pb-[calc(3.5rem+env(safe-area-inset-bottom,0px))] lg:pb-0">
  <div class="mx-auto flex max-w-6xl flex-col gap-4 px-4 py-8">
    <div class="flex flex-col gap-5 md:flex-row md:items-start md:justify-between">
      <div class="max-w-sm space-y-3">
        <app-brand-logo [showSubtitle]="false" />
        <p class="text-sm leading-relaxed text-[var(--color-text-muted)]">{{ 'footer.tagline' | translate }}</p>
      </div>

      <nav [attr.aria-label]="'footer.linksLabel' | translate">
        <ul class="flex flex-wrap gap-x-6">
          @for (link of links; track link.id) {
            <li>
              <a
                [routerLink]="link.path"
                class="flex min-h-11 items-center rounded-[var(--radius-sm)] text-sm font-medium text-[var(--color-text)]
                  transition-colors duration-200 ease-out hover:text-[var(--color-primary-text)]
                  focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-focus-ring)]"
              >
                {{ link.labelKey | translate }}
              </a>
            </li>
          }
        </ul>
      </nav>
    </div>

    <div
      class="flex flex-col gap-1 border-t border-[var(--color-border)] pt-4 md:flex-row md:items-center md:justify-between"
    >
      <p class="text-sm text-[var(--color-text-muted)]">{{ 'footer.copyright' | translate: { year: year } }}</p>

      <nav [attr.aria-label]="'footer.legalLabel' | translate">
        <ul class="flex flex-wrap gap-x-5">
          @for (link of legalLinks; track link.id) {
            <li>
              <a
                [routerLink]="link.path"
                class="flex min-h-11 items-center rounded-[var(--radius-sm)] text-sm text-[var(--color-text-muted)]
                  transition-colors duration-200 ease-out hover:text-[var(--color-primary-text)]
                  focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-focus-ring)]"
              >
                {{ link.labelKey | translate }}
              </a>
            </li>
          }
        </ul>
      </nav>
    </div>
  </div>
</footer>
