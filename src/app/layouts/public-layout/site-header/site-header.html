<!-- Slim top strip: tagline + language dropdown (desktop chrome; the drawer has its own language toggle). -->
<div class="hidden border-b border-[var(--glass-border)] bg-[var(--glass-bg)] md:block">
  <div class="mx-auto flex h-9 max-w-6xl items-center justify-between gap-4 px-4">
    <p class="truncate text-[13px] text-[var(--color-text-muted)]">{{ 'nav.tagline' | translate }}</p>
    <div class="flex items-center gap-3">
      <app-theme-toggle />
      <app-language-menu />
    </div>
  </div>
</div>

<header class="glass-panel sticky top-0 z-30 rounded-none border-x-0 border-t-0">
  <div class="mx-auto flex h-14 max-w-6xl items-center gap-3 px-4 md:h-[4.5rem] md:gap-4">
    <app-brand-logo class="shrink-0" />

    <div class="hidden min-w-0 flex-1 md:block">
      <app-header-search />
    </div>

    <div class="ml-auto flex items-center gap-1 md:ml-0 md:gap-2">
      <a
        [routerLink]="instructorCta().route"
        class="mr-1 hidden h-11 items-center gap-2 rounded-full bg-[var(--color-primary)] px-5 text-sm font-semibold
          text-[var(--color-primary-foreground)] shadow-[var(--shadow-sm)] transition-[background-color,box-shadow] duration-200 ease-out motion-reduce:transition-none hover:shadow-[var(--shadow-glow)]
          hover:bg-[var(--color-primary-pressed)] focus-visible:outline-none focus-visible:ring-2
          focus-visible:ring-[var(--color-focus-ring)] focus-visible:ring-offset-2
          focus-visible:ring-offset-[var(--color-bg)] lg:flex"
      >
        <ng-icon name="phosphorChalkboardTeacher" aria-hidden="true" class="text-lg" />
        {{ instructorCta().labelKey | translate }}
      </a>

      <app-header-icon-link
        class="hidden md:block"
        route="/wishlist"
        icon="phosphorHeart"
        [label]="wishlistLabel()"
        [count]="wishlistStore.count()"
      />
      <app-header-icon-link class="hidden lg:block" route="/account/orders" icon="phosphorPackage" [label]="ordersLabel()" />
      <app-header-icon-link route="/cart" icon="phosphorShoppingCart" [label]="cartLabel()" [count]="cartStore.itemCount()" />

      @if (authService.isAuthenticated()) {
        <app-notification-bell />
      }

      <div class="ml-1 flex items-center">
        <app-header-auth />
      </div>

      <button
        type="button"
        (click)="mobileNavOpen.set(true)"
        [attr.aria-expanded]="mobileNavOpen()"
        [attr.aria-controls]="mobileNavPanelId"
        aria-haspopup="dialog"
        [attr.aria-label]="'nav.openMenu' | translate"
        class="flex h-11 w-11 shrink-0 cursor-pointer items-center justify-center rounded-full text-xl text-[var(--color-text)]
          transition-colors duration-200 ease-out hover:bg-[var(--color-surface-muted)] focus-visible:outline-none
          focus-visible:ring-2 focus-visible:ring-[var(--color-focus-ring)] lg:hidden"
      >
        <ng-icon name="phosphorList" aria-hidden="true" />
      </button>
    </div>
  </div>

  <!-- Secondary nav row (lg+): Categories mega menu pill + primary links. -->
  <nav
    [attr.aria-label]="'nav.mainNavLabel' | translate"
    class="hidden border-t border-[var(--glass-border)] lg:block"
  >
    <div class="mx-auto flex h-12 max-w-6xl items-center gap-1 px-4">
      <app-category-mega-menu class="mr-2" [categories]="categories()" />
      <div class="glass-pill flex items-center gap-1 rounded-full px-2">
      @for (link of navLinks; track link.id) {
        <a
          [routerLink]="link.path"
          [queryParams]="link.queryParams"
          routerLinkActive="font-semibold text-[var(--color-primary-text)]"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="link.activeOptions ?? { exact: link.exact }"
          class="flex h-11 items-center rounded-full px-3 text-sm font-medium text-[var(--color-text)] transition-colors
            duration-200 ease-out hover:text-[var(--color-primary-text)] focus-visible:outline-none focus-visible:ring-2
            focus-visible:ring-[var(--color-focus-ring)]"
        >
          {{ link.labelKey | translate }}
        </a>
      }
      </div>
    </div>
  </nav>

</header>

<!-- Search sits on its own row below the sticky bar on small screens, scrolling away with the page. -->
<div class="border-b border-[var(--glass-border)] bg-[var(--glass-bg)] px-4 pb-3 pt-1 md:hidden">
  <app-header-search />
</div>

<!-- Outside <header> on purpose: the header is a z-30 stacking context, which would leave the fixed bottom
     mobile nav (z-40) painting over the drawer's footer (language toggle, sign out). -->
<app-mobile-nav [(open)]="mobileNavOpen" [categories]="categories()" />
