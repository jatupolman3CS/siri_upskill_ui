<!-- tabindex="-1": see account-menu.html — only there so the linter accepts the Escape handler. -->
<div class="relative" tabindex="-1" (keydown.escape)="onEscape()">
  <button
    #triggerButton
    type="button"
    aria-haspopup="menu"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="open() ? panelId : null"
    (click)="toggle()"
    (keydown.arrowdown)="openFromKeyboard($event)"
    class="relative z-50 flex h-8 cursor-pointer items-center gap-1.5 rounded-full glass-pill pl-2.5 pr-2 text-[13px] font-semibold text-[var(--color-text)]
      transition-colors duration-200 ease-out hover:border-[var(--color-primary)]
      after:absolute after:inset-x-0 after:-inset-y-1.5 after:content-['']
      focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-focus-ring)]"
  >
    <ng-icon name="phosphorGlobe" aria-hidden="true" class="text-sm" />
    <span class="sr-only">{{ 'nav.languageMenuLabel' | translate }}:</span>
    <span>{{ translation.locale().toUpperCase() }}</span>
    <ng-icon
      name="phosphorCaretDown"
      aria-hidden="true"
      class="text-xs transition-transform duration-200 ease-out motion-reduce:transition-none"
      [class.rotate-180]="open()"
    />
  </button>

  @if (open()) {
    <div role="presentation" class="fixed inset-0 z-40" (click)="close()"></div>

    <ul
      [id]="panelId"
      role="menu"
      [attr.aria-label]="'nav.languageMenuLabel' | translate"
      appMenuNavigation
      (tabOut)="close()"
      class="absolute right-0 top-full z-50 mt-1.5 w-40 overflow-hidden rounded-[var(--radius-lg)] glass-panel
        bg-[var(--glass-bg-strong)] p-1"
    >
      @for (option of options; track option.locale) {
        <li role="none">
          <button
            type="button"
            role="menuitemradio"
            tabindex="-1"
            [attr.aria-checked]="translation.locale() === option.locale"
            (click)="select(option.locale)"
            class="flex min-h-11 w-full cursor-pointer items-center justify-between gap-2 rounded-[var(--radius-md)] px-3
              text-left text-sm text-[var(--color-text)] hover:bg-[var(--color-surface-muted)]
              focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-[var(--color-focus-ring)]"
            [class.font-semibold]="translation.locale() === option.locale"
          >
            {{ option.labelKey | translate }}
            @if (translation.locale() === option.locale) {
              <ng-icon name="phosphorCheck" aria-hidden="true" class="text-[var(--color-primary-text)]" />
            }
          </button>
        </li>
      }
    </ul>
  }
</div>
