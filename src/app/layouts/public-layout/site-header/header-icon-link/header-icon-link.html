<a
  [routerLink]="route()"
  [attr.aria-label]="label()"
  class="relative flex h-11 w-11 cursor-pointer items-center justify-center rounded-full glass-pill text-[var(--color-text)] transition-colors duration-200 ease-out
    hover:border-[var(--color-primary)] hover:text-[var(--color-primary-text)]
    focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-focus-ring)] focus-visible:ring-offset-2
    focus-visible:ring-offset-[var(--color-bg)]"
>
  <ng-icon [name]="icon()" aria-hidden="true" class="text-xl" />
  @if (count() > 0) {
    <span
      aria-hidden="true"
      class="absolute -right-1 -top-1 flex h-[1.125rem] min-w-[1.125rem] items-center justify-center rounded-full
        bg-[var(--color-primary)] px-1 text-[11px] font-bold leading-none text-[var(--color-primary-foreground)]"
    >
      {{ badgeText() }}
    </span>
  }
</a>
