@if (!auth.sessionResolved()) {
  <span
    data-testid="auth-placeholder"
    aria-hidden="true"
    class="block h-11 w-11 rounded-full bg-[var(--color-surface-muted)] motion-safe:animate-pulse"
  ></span>
} @else if (auth.isAuthenticated()) {
  <app-account-menu />
} @else {
  <div class="flex items-center gap-1">
    <a
      routerLink="/login"
      class="flex h-11 items-center whitespace-nowrap rounded-full px-3 text-sm font-medium text-[var(--color-text)] transition-colors
        duration-200 ease-out hover:text-[var(--color-primary)] focus-visible:outline-none focus-visible:ring-2
        focus-visible:ring-[var(--color-focus-ring)]"
    >
      {{ 'nav.login' | translate }}
    </a>
    <a
      routerLink="/register"
      class="hidden h-11 items-center rounded-full bg-[var(--color-primary)] px-5 text-sm font-semibold
        text-[var(--color-primary-foreground)] transition-colors duration-200 ease-out hover:bg-[var(--color-primary-hover)]
        focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-focus-ring)]
        focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--color-bg)] lg:flex"
    >
      {{ 'nav.register' | translate }}
    </a>
  </div>
}
