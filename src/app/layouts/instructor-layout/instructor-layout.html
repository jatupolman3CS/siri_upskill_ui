<div class="flex h-screen flex-col bg-[var(--color-bg)] overflow-hidden select-none">
  <!-- Top Navigation Bar -->
  <header class="flex h-16 shrink-0 items-center justify-between border-b border-[var(--color-border)] bg-[var(--color-surface)] px-6">
    <div class="flex items-center gap-4">
      <a routerLink="/" class="text-lg font-extrabold tracking-tight text-[var(--color-primary)]">
        SIRI UpSkill <span class="text-xs font-semibold uppercase tracking-wider text-[var(--color-text-muted)] ml-1">Studio</span>
      </a>
      <span class="rounded-full bg-indigo-500/10 px-2.5 py-0.5 text-xs font-bold text-indigo-600">
        โหมดผู้สอน (Instructor)
      </span>
    </div>

    <!-- Right Header CTA & Switcher -->
    <div class="flex items-center gap-4">
      <a
        routerLink="/"
        class="inline-flex items-center gap-1.5 rounded-xl border border-[var(--color-border)] bg-[var(--color-surface-muted)] px-3 py-1.5 text-xs font-semibold text-[var(--color-text)] transition hover:bg-[var(--color-surface-muted)]/80"
      >
        <ng-icon name="phosphorArrowLeft" />
        <span>สลับไปมุมมองผู้เรียน</span>
      </a>

      <a
        routerLink="/instructor/courses/new"
        class="inline-flex items-center gap-1.5 rounded-xl bg-[var(--color-primary)] px-4 py-2 text-xs font-bold text-white shadow-sm transition hover:bg-[var(--color-primary-hover)]"
      >
        <ng-icon name="phosphorPlusCircle" class="text-sm" />
        <span>สร้างคอร์สใหม่</span>
      </a>
    </div>
  </header>

  <!-- Studio Shell: Sidebar + Content Outlet -->
  <div class="flex flex-1 min-h-0 overflow-hidden">
    <!-- Left Navigation Sidebar -->
    <aside class="w-64 shrink-0 border-r border-[var(--color-border)] bg-[var(--color-surface)] flex flex-col justify-between p-4 hidden md:flex">
      <nav class="space-y-1">
        <a
          routerLink="/instructor"
          routerLinkActive="bg-[var(--color-primary)] text-white shadow-sm font-bold"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-[var(--color-text-muted)] hover:bg-[var(--color-surface-muted)] hover:text-[var(--color-text)] transition"
        >
          <ng-icon name="phosphorHouse" class="text-lg" />
          <span>แดชบอร์ด</span>
        </a>

        <a
          routerLink="/instructor/courses"
          routerLinkActive="bg-[var(--color-primary)] text-white shadow-sm font-bold"
          class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-[var(--color-text-muted)] hover:bg-[var(--color-surface-muted)] hover:text-[var(--color-text)] transition"
        >
          <ng-icon name="phosphorBookOpen" class="text-lg" />
          <span>คอร์สของฉัน</span>
        </a>

        <a
          routerLink="/instructor/analytics"
          routerLinkActive="bg-[var(--color-primary)] text-white shadow-sm font-bold"
          class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-[var(--color-text-muted)] hover:bg-[var(--color-surface-muted)] hover:text-[var(--color-text)] transition"
        >
          <ng-icon name="phosphorChartBar" class="text-lg" />
          <span>การวิเคราะห์ (Analytics)</span>
        </a>

        <a
          routerLink="/instructor/announcements"
          routerLinkActive="bg-[var(--color-primary)] text-white shadow-sm font-bold"
          class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-[var(--color-text-muted)] hover:bg-[var(--color-surface-muted)] hover:text-[var(--color-text)] transition"
        >
          <ng-icon name="phosphorMegaphone" class="text-lg" />
          <span>ส่งประกาศ (Announcements)</span>
        </a>

        <a
          routerLink="/instructor/earnings"
          routerLinkActive="bg-[var(--color-primary)] text-white shadow-sm font-bold"
          class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-[var(--color-text-muted)] hover:bg-[var(--color-surface-muted)] hover:text-[var(--color-text)] transition"
        >
          <ng-icon name="phosphorCurrencyDollar" class="text-lg" />
          <span>รายได้ & ส่วนแบ่ง (Earnings)</span>
        </a>
      </nav>

      <div class="border-t border-[var(--color-border)] pt-4">
        <div class="flex items-center gap-3 px-2">
          <div class="flex h-9 w-9 items-center justify-center rounded-full bg-[var(--color-primary)]/10 text-[var(--color-primary)] font-bold">
            <ng-icon name="phosphorUser" />
          </div>
          <div class="min-w-0 flex-1">
            <p class="text-xs font-bold text-[var(--color-text)] truncate">อาจารย์ผู้สอน</p>
            <p class="text-[10px] text-[var(--color-text-muted)] truncate">instructor&#64;siriupskill.com</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Workspace Content -->
    <main class="flex-1 overflow-y-auto bg-[var(--color-bg)] p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
