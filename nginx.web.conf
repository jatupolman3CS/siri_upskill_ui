server {
    listen 9005;
    server_name _;

    root /usr/share/nginx/html;
    
    # This is the crucial fix for Angular SSR builds
    index index.csr.html index.html; 

    location / {
        try_files $uri $uri/ /index.csr.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}